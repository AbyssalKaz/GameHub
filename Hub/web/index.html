<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Hub</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="features.css">
  <link rel="stylesheet" href="window.css">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="stores.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="discovery.css">
  <link rel="stylesheet" href="play.css">
  <link rel="stylesheet" href="organize.css">
  <link rel="stylesheet" href="meta.css">
  <link rel="stylesheet" href="deals.css">
  <link rel="stylesheet" href="cleanup.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <header class="topbar" data-drag>
        <label class="search" id="searchBox">
          <svg viewBox="0 0 24 24" class="glyph"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="text" placeholder="Search your games" autocomplete="off" spellcheck="false">
          <button class="search-clear" id="searchClear" title="Clear search" hidden>
            <svg viewBox="0 0 24 24" class="glyph"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
          <kbd>Ctrl K</kbd>
        </label>

        <div class="controls">
          <div class="dropdown" id="sortDropdown">
            <button class="dropdown-button" id="sortButton">
              <svg viewBox="0 0 24 24" class="glyph"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
              <span id="sortLabel">Name</span>
              <svg viewBox="0 0 24 24" class="glyph chevron"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="dropdown-menu" id="sortMenu"></div>
          </div>

          <div class="segmented" id="viewToggle">
            <button data-view="grid" title="Grid view">
              <svg viewBox="0 0 24 24" class="glyph"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
            </button>
            <button data-view="list" title="List view">
              <svg viewBox="0 0 24 24" class="glyph"><path d="M9 6h12M9 12h12M9 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01" class="dots"/></svg>
            </button>
          </div>

          <label class="zoom" id="zoomControl" title="Cover size">
            <svg viewBox="0 0 24 24" class="glyph small"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
            <input type="range" id="cardSize" min="140" max="280" step="10">
            <svg viewBox="0 0 24 24" class="glyph"><rect x="3" y="3" width="18" height="18" rx="2.5"/></svg>
          </label>
        </div>
      </header>

      <section class="headline" data-drag>
        <div class="headline-text">
          <h1 id="pageTitle">All games</h1>
          <div class="summary" id="summary"></div>
        </div>
        <div class="filters" id="filters"></div>
      </section>

      <div class="scroller" id="scroller">
        <div id="results"></div>
      </div>
    </main>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="context-menu" id="contextMenu"></div>
  <div class="home" id="home"></div>
  <div class="modal-layer" id="modalLayer"></div>
  <div class="toasts" id="toasts"></div>

  <script src="app.js"></script>
  <script src="render.js"></script>
  <script src="covers.js"></script>
  <script src="free.js"></script>
  <script src="uninstall.js"></script>
  <script src="window.js"></script>
  <script src="home.js"></script>
  <script src="stores.js"></script>
  <script src="settings.js"></script>
  <script src="discovery.js"></script>
  <script src="play.js"></script>
  <script src="organize.js"></script>
  <script src="meta.js"></script>
  <script src="deals.js"></script>
  <script src="saves.js"></script>
  <script src="move.js"></script>
  <script src="cleanup.js"></script>
  <script src="gamepad.js"></script>
</body>
</html>
